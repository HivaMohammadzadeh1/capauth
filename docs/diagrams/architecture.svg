<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" role="img" aria-label="Architecture: Claude Code holds a lease and calls tools only through the Scope MCP server. Scope issues the lease from the plan under a policy ceiling, enforces every call in pure code, waits for the operator on sensitive actions, and writes a hash-chained ledger. Allowed calls reach Slack, GitHub, Drive and Email. Results return to the agent as untrusted content."><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#8E9DB1"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#3ED2A6"/></marker><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#A78BFA"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#FF6B6B"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#F2B44A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#5AD1DB"/></marker></defs><rect width="1280" height="610" rx="18" fill="#0B1017"/><g font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="18" fill="#E9EEF5"><rect x="30" y="60" width="280" height="140" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="52" y="94" font-weight="600" font-size="20" fill="#E9EEF5">Agent: Claude Code</text><text x="52" y="122" font-size="16" fill="#8E9DB1">built-in tools off</text><text x="52" y="146" font-size="16" fill="#8E9DB1">holds a lease, no credential</text><text x="52" y="170" font-size="16" fill="#8E9DB1">reads tool results as untrusted</text><rect x="30" y="420" width="280" height="96" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="52" y="454" font-weight="600" font-size="20" fill="#E9EEF5">Operator</text><text x="52" y="482" font-size="16" fill="#8E9DB1">gives the task</text><text x="52" y="506" font-size="16" fill="#8E9DB1">answers approvals</text><rect x="420" y="36" width="540" height="488" rx="18" fill="none" stroke="#5AD1DB" stroke-width="1.5" stroke-dasharray="7 6"/><text x="444" y="66" font-weight="600" font-size="20" fill="#5AD1DB">Scope, the MCP server</text><rect x="444" y="84" width="492" height="118" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="466" y="118" font-weight="600" font-size="20" fill="#E9EEF5">Lease issuer</text><text x="466" y="146" font-size="16" fill="#8E9DB1">security planner (Claude) proposes the minimal set</text><text x="466" y="170" font-size="16" fill="#8E9DB1">policy ceiling clamps it: narrow only, never widen</text><text x="466" y="194" font-size="16" fill="#8E9DB1">signs the lease, ten-minute TTL</text><rect x="444" y="226" width="492" height="96" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="466" y="260" font-weight="600" font-size="20" fill="#E9EEF5">Enforcer, pure code</text><text x="466" y="288" font-size="16" fill="#8E9DB1">signature and TTL, then tool + action + resource glob</text><text x="466" y="312" font-size="16" fill="#8E9DB1">no model call on this path</text><rect x="444" y="348" width="234" height="150" rx="14" fill="#121A24" stroke="#A78BFA" stroke-width="1.5"/><text x="466" y="382" font-weight="600" font-size="20" fill="#A78BFA">Approval gate</text><text x="466" y="410" font-size="16" fill="#8E9DB1">blocks the call until</text><text x="466" y="434" font-size="16" fill="#8E9DB1">a person answers</text><rect x="702" y="348" width="234" height="150" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="724" y="382" font-weight="600" font-size="20" fill="#E9EEF5">Ledger</text><text x="724" y="410" font-size="16" fill="#8E9DB1">every decision, hash-chained</text><text x="724" y="434" font-size="16" fill="#8E9DB1">who, for whom, what,</text><text x="724" y="458" font-size="16" fill="#8E9DB1">why, when</text><rect x="1020" y="190" width="230" height="230" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="1042" y="224" font-weight="600" font-size="20" fill="#E9EEF5">Tools</text><rect x="1042" y="236" width="186" height="32" rx="8" fill="#0B1017" stroke="#2A3846"/><text x="1056" y="257" font-size="16">Slack</text><rect x="1042" y="278" width="186" height="32" rx="8" fill="#0B1017" stroke="#2A3846"/><text x="1056" y="299" font-size="16">GitHub</text><rect x="1042" y="320" width="186" height="32" rx="8" fill="#0B1017" stroke="#2A3846"/><text x="1056" y="341" font-size="16">Google Drive</text><rect x="1042" y="362" width="186" height="32" rx="8" fill="#0B1017" stroke="#2A3846"/><text x="1056" y="383" font-size="16">Email</text><polyline points="310,100 442,100" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="376" y="90" font-size="15" fill="#8E9DB1" text-anchor="middle">plan</text><polyline points="444,150 312,150" fill="none" stroke="#5AD1DB" stroke-width="2" marker-end="url(#mc)"/><text x="376" y="140" font-size="15" fill="#5AD1DB" text-anchor="middle">lease, signed</text><polyline points="310,180 400,180 400,274 442,274" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="330" y="205" font-size="15" fill="#8E9DB1" text-anchor="start">tool call + lease</text><polyline points="170,418 170,202" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="180" y="316" font-size="15" fill="#8E9DB1" text-anchor="start">task</text><polyline points="444,468 312,468" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#mv)"/><text x="378" y="458" font-size="15" fill="#A78BFA" text-anchor="middle">approve / deny</text><polyline points="936,274 1018,274" fill="none" stroke="#3ED2A6" stroke-width="2" marker-end="url(#mg)"/><text x="977" y="262" font-size="15" fill="#3ED2A6" text-anchor="middle">if allowed</text><polyline points="561,322 561,346" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#mv)"/><text x="571" y="340" font-size="14" fill="#A78BFA" text-anchor="start">HUMAN_APPROVAL</text><polyline points="819,322 819,346" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="829" y="340" font-size="14" fill="#8E9DB1" text-anchor="start">every decision</text><polyline points="1135,420 1135,566 14,566 14,130 28,130" fill="none" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#mr)"/><text x="640" y="590" font-size="15" fill="#FF6B6B" text-anchor="middle">results back to the agent: untrusted content, may carry a prompt injection</text></g></svg>