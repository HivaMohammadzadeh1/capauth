<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 476" role="img" aria-label="The decision path for one tool call. Lease valid, action in lease, resource covered, and not sensitive gives ALLOW. A sensitive action waits for a person. A request wider than the lease that can be narrowed gives ALLOW_LIMITED. Everything else is DENY."><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#8E9DB1"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#3ED2A6"/></marker><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#A78BFA"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#FF6B6B"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#F2B44A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#5AD1DB"/></marker></defs><rect width="1280" height="476" rx="18" fill="#0B1017"/><g font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="18" fill="#E9EEF5"><rect x="40" y="60" width="220" height="104" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="60" y="96" font-weight="600" font-size="20">lease valid?</text><text x="60" y="122" font-size="15" fill="#8E9DB1">signature, TTL, not revoked,</text><text x="60" y="144" font-size="15" fill="#8E9DB1">not on the never list</text><rect x="300" y="60" width="220" height="104" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="320" y="96" font-weight="600" font-size="20">action in lease?</text><text x="320" y="122" font-size="15" fill="#8E9DB1">the lease holds this</text><text x="320" y="144" font-size="15" fill="#8E9DB1">tool and action</text><rect x="560" y="60" width="220" height="104" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="580" y="96" font-weight="600" font-size="20">resource covered?</text><text x="580" y="122" font-size="15" fill="#8E9DB1">the call resource matches</text><text x="580" y="144" font-size="15" fill="#8E9DB1">the lease resource glob</text><rect x="820" y="60" width="220" height="104" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="840" y="96" font-weight="600" font-size="20">sensitive?</text><text x="840" y="122" font-size="15" fill="#8E9DB1">policy marks this action</text><text x="840" y="144" font-size="15" fill="#8E9DB1">for a person</text><polyline points="260,112 298,112" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="280" y="104" font-size="14" fill="#8E9DB1" text-anchor="middle">yes</text><polyline points="520,112 558,112" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="540" y="104" font-size="14" fill="#8E9DB1" text-anchor="middle">yes</text><polyline points="780,112 818,112" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="800" y="104" font-size="14" fill="#8E9DB1" text-anchor="middle">yes</text><rect x="1080" y="60" width="160" height="104" rx="14" fill="#3ED2A6" fill-opacity="0.12" stroke="#3ED2A6" stroke-width="1.5"/><text x="1100" y="96" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="18" fill="#3ED2A6">ALLOW</text><text x="1100" y="122" font-size="15" fill="#8E9DB1">inside the lease;</text><text x="1100" y="144" font-size="15" fill="#8E9DB1">the call runs</text><polyline points="1040,112 1078,112" fill="none" stroke="#3ED2A6" stroke-width="2" marker-end="url(#mg)"/><text x="1059" y="104" font-size="14" fill="#3ED2A6" text-anchor="middle">no</text><rect x="40" y="270" width="220" height="104" rx="14" fill="#FF6B6B" fill-opacity="0.12" stroke="#FF6B6B" stroke-width="1.5"/><text x="60" y="306" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="18" fill="#FF6B6B">DENY</text><text x="60" y="332" font-size="15" fill="#8E9DB1">never reaches the tool;</text><text x="60" y="354" font-size="15" fill="#8E9DB1">reason recorded</text><rect x="300" y="270" width="220" height="104" rx="14" fill="#FF6B6B" fill-opacity="0.12" stroke="#FF6B6B" stroke-width="1.5"/><text x="320" y="306" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="18" fill="#FF6B6B">DENY</text><text x="320" y="332" font-size="15" fill="#8E9DB1">never reaches the tool;</text><text x="320" y="354" font-size="15" fill="#8E9DB1">reason and provenance</text><rect x="560" y="270" width="220" height="104" rx="14" fill="#121A24" stroke="#2A3846" stroke-width="1.5"/><text x="580" y="306" font-weight="600" font-size="20">narrowable?</text><text x="580" y="332" font-size="15" fill="#8E9DB1">the lease resource is a strict</text><text x="580" y="354" font-size="15" fill="#8E9DB1">subset of what was asked</text><rect x="820" y="270" width="220" height="104" rx="14" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-width="1.5"/><text x="840" y="306" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="18" fill="#A78BFA">HUMAN_APPROVAL</text><text x="840" y="332" font-size="15" fill="#8E9DB1">a person decides: once,</text><text x="840" y="354" font-size="15" fill="#8E9DB1">for the task, or deny</text><rect x="1080" y="270" width="160" height="104" rx="14" fill="#F2B44A" fill-opacity="0.12" stroke="#F2B44A" stroke-width="1.5"/><text x="1100" y="306" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="18" fill="#F2B44A">ALLOW_LIMITED</text><text x="1100" y="332" font-size="15" fill="#8E9DB1">narrowed to the</text><text x="1100" y="354" font-size="15" fill="#8E9DB1">lease resource</text><polyline points="150,164 150,268" fill="none" stroke="#FF6B6B" stroke-width="2" marker-end="url(#mr)"/><text x="160" y="230" font-size="14" fill="#FF6B6B" text-anchor="start">no</text><polyline points="410,164 410,268" fill="none" stroke="#FF6B6B" stroke-width="2" marker-end="url(#mr)"/><text x="420" y="230" font-size="14" fill="#FF6B6B" text-anchor="start">no</text><polyline points="670,164 670,268" fill="none" stroke="#8E9DB1" stroke-width="2" marker-end="url(#m)"/><text x="680" y="230" font-size="14" fill="#8E9DB1" text-anchor="start">no</text><polyline points="930,164 930,268" fill="none" stroke="#A78BFA" stroke-width="2" marker-end="url(#mv)"/><text x="940" y="230" font-size="14" fill="#A78BFA" text-anchor="start">yes</text><polyline points="670,374 670,410 1160,410 1160,376" fill="none" stroke="#F2B44A" stroke-width="2" marker-end="url(#ma)"/><text x="915" y="402" font-size="14" fill="#F2B44A" text-anchor="middle">yes</text><polyline points="560,322 522,322" fill="none" stroke="#FF6B6B" stroke-width="2" marker-end="url(#mr)"/><text x="541" y="314" font-size="14" fill="#FF6B6B" text-anchor="middle">no</text><text x="40" y="452" font-size="15" fill="#8E9DB1" text-anchor="start">Approve once or for the task turns HUMAN_APPROVAL into ALLOW; deny turns it into DENY. Every branch appends one ledger entry. No model call, no network on this path.</text></g></svg>