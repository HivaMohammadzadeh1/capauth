<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" role="img" aria-label="Lease lifecycle: task given, plan written, lease issued with a ten-minute TTL, tool calls checked against it, task ends, lease revoked early, ledger exported and verified"><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#8E9DB1"/></marker><marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#3ED2A6"/></marker><marker id="mv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#A78BFA"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#FF6B6B"/></marker><marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#F2B44A"/></marker><marker id="mc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="#5AD1DB"/></marker></defs><rect width="1280" height="300" rx="18" fill="#0B1017"/><g font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="18" fill="#E9EEF5"><line x1="120" y1="150" x2="1220" y2="150" stroke="#2A3846" stroke-width="3"/><rect x="520" y="140" width="480" height="20" rx="10" fill="#5AD1DB" fill-opacity="0.25"/><rect x="1000" y="140" width="220" height="20" rx="10" fill="#8E9DB1" fill-opacity="0.18"/><text x="760" y="190" font-size="14" fill="#5AD1DB" text-anchor="middle">lease active</text><text x="1100" y="190" font-size="14" fill="#8E9DB1" text-anchor="middle">unused TTL, revoked</text><circle cx="120" cy="150" r="9" fill="#0B1017" stroke="#8E9DB1" stroke-width="3"/><text x="120" y="60" font-size="14" fill="#8E9DB1" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace">0:00</text><text x="120" y="92" font-size="19" font-weight="600" text-anchor="middle">Task</text><text x="120" y="116" font-size="14" fill="#8E9DB1" text-anchor="middle">operator picks the identity</text><circle cx="320" cy="150" r="9" fill="#0B1017" stroke="#8E9DB1" stroke-width="3"/><text x="320" y="60" font-size="14" fill="#8E9DB1" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace">0:05</text><text x="320" y="92" font-size="19" font-weight="600" text-anchor="middle">Plan</text><text x="320" y="116" font-size="14" fill="#8E9DB1" text-anchor="middle">Claude Code writes 3 to 5 steps</text><circle cx="520" cy="150" r="9" fill="#0B1017" stroke="#5AD1DB" stroke-width="3"/><text x="520" y="60" font-size="14" fill="#8E9DB1" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace">0:08</text><text x="520" y="92" font-size="19" font-weight="600" text-anchor="middle">Lease issued</text><text x="520" y="116" font-size="14" fill="#8E9DB1" text-anchor="middle">TTL 10:00 starts</text><circle cx="760" cy="150" r="9" fill="#0B1017" stroke="#5AD1DB" stroke-width="3"/><text x="760" y="60" font-size="14" fill="#8E9DB1" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace">0:08 to 0:30</text><text x="760" y="92" font-size="19" font-weight="600" text-anchor="middle">Calls checked</text><text x="760" y="116" font-size="14" fill="#8E9DB1" text-anchor="middle">ALLOW, LIMITED, APPROVAL, DENY</text><circle cx="1000" cy="150" r="9" fill="#0B1017" stroke="#5AD1DB" stroke-width="3"/><text x="1000" y="60" font-size="14" fill="#8E9DB1" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace">0:30</text><text x="1000" y="92" font-size="19" font-weight="600" text-anchor="middle">Task ends</text><text x="1000" y="116" font-size="14" fill="#8E9DB1" text-anchor="middle">revoked 9 min early</text><circle cx="1180" cy="150" r="9" fill="#0B1017" stroke="#8E9DB1" stroke-width="3"/><text x="1180" y="60" font-size="14" fill="#8E9DB1" text-anchor="middle" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace">0:31</text><text x="1180" y="92" font-size="19" font-weight="600" text-anchor="middle">Ledger</text><text x="1180" y="116" font-size="14" fill="#8E9DB1" text-anchor="middle">chain verified</text><rect x="580" y="225" width="71" height="30" rx="15" fill="#3ED2A6" fill-opacity="0.16" stroke="#3ED2A6" stroke-width="1.2"/><text x="616" y="245" font-size="14" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" fill="#3ED2A6" text-anchor="middle" font-weight="500">ALLOW</text><rect x="663.4" y="225" width="89" height="30" rx="15" fill="#F2B44A" fill-opacity="0.16" stroke="#F2B44A" stroke-width="1.2"/><text x="708" y="245" font-size="14" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" fill="#F2B44A" text-anchor="middle" font-weight="500">LIMITED</text><rect x="764.16" y="225" width="97" height="30" rx="15" fill="#A78BFA" fill-opacity="0.16" stroke="#A78BFA" stroke-width="1.2"/><text x="813" y="245" font-size="14" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" fill="#A78BFA" text-anchor="middle" font-weight="500">APPROVAL</text><rect x="873.5999999999999" y="225" width="63" height="30" rx="15" fill="#FF6B6B" fill-opacity="0.16" stroke="#FF6B6B" stroke-width="1.2"/><text x="905" y="245" font-size="14" font-family="IBM Plex Mono, SFMono-Regular, Menlo, monospace" fill="#FF6B6B" text-anchor="middle" font-weight="500">DENY</text><text x="120" y="285" font-size="15" fill="#8E9DB1" text-anchor="start">Nothing about the lease survives the task. The next task starts from its own plan.</text></g></svg>