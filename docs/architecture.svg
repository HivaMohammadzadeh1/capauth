<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'IBM Plex Sans', system-ui, sans-serif" role="img" aria-label="CapAuth architecture: the operator gives the agent a task; the agent sends its plan to the lease issuer and gets a signed lease; every tool call goes through the enforcer, which forwards allowed calls to the tools, routes sensitive calls to the approval gate, and writes every decision to the audit ledger; tool results return to the agent as untrusted content that may carry a prompt injection.">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A9AAE"/></marker>
    <marker id="arwc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5AD1DB"/></marker>
    <marker id="arwg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3ED2A6"/></marker>
    <marker id="arwv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A78BFA"/></marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FF6B6B"/></marker>
  </defs>

  <rect x="0" y="0" width="1000" height="600" fill="#0D131B"/>
  <text x="40" y="46" fill="#E6EDF5" font-size="24" font-weight="700">How CapAuth sits between the agent and its tools</text>

  <rect x="300" y="86" width="420" height="404" rx="16" fill="#5AD1DB" fill-opacity="0.05" stroke="#5AD1DB" stroke-width="1.2" stroke-dasharray="6 5"/>
  <text x="316" y="112" fill="#5AD1DB" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace">SCOPE, the authorization plane</text>

  <rect x="810" y="150" width="160" height="300" rx="12" fill="#0F1722" stroke="#26323F"/>
  <text x="826" y="176" fill="#8A9AAE" font-size="13" font-family="'IBM Plex Mono', ui-monospace, monospace">TOOLS</text>
  <rect x="826" y="192" width="128" height="54" rx="8" fill="#1B2531" stroke="#26323F"/><text x="842" y="224" fill="#E6EDF5" font-size="15">Slack</text>
  <rect x="826" y="256" width="128" height="54" rx="8" fill="#1B2531" stroke="#26323F"/><text x="842" y="288" fill="#E6EDF5" font-size="15">GitHub</text>
  <rect x="826" y="320" width="128" height="54" rx="8" fill="#1B2531" stroke="#26323F"/><text x="842" y="352" fill="#E6EDF5" font-size="15">Google Drive</text>
  <rect x="826" y="384" width="128" height="54" rx="8" fill="#1B2531" stroke="#26323F"/><text x="842" y="416" fill="#E6EDF5" font-size="15">Email</text>

  <rect x="30" y="150" width="200" height="96" rx="12" fill="#141C27" stroke="#26323F"/>
  <text x="48" y="184" fill="#E6EDF5" font-size="18" font-weight="600">Agent</text>
  <text x="48" y="210" fill="#8A9AAE" font-size="13">Claude tool-use loop.</text>
  <text x="48" y="228" fill="#8A9AAE" font-size="13">Holds a lease, not a token.</text>

  <rect x="30" y="404" width="200" height="76" rx="12" fill="#141C27" stroke="#26323F"/>
  <text x="48" y="436" fill="#E6EDF5" font-size="18" font-weight="600">Operator</text>
  <text x="48" y="460" fill="#8A9AAE" font-size="13">Gives task. Answers approvals.</text>

  <rect x="320" y="130" width="380" height="80" rx="12" fill="#141C27" stroke="#26323F"/>
  <text x="338" y="160" fill="#E6EDF5" font-size="17" font-weight="600">Lease issuer</text>
  <text x="338" y="186" fill="#8A9AAE" font-size="13">Planner proposes, ceiling caps. Narrows only, never widens.</text>

  <rect x="320" y="240" width="380" height="80" rx="12" fill="#141C27" stroke="#26323F"/>
  <text x="338" y="270" fill="#E6EDF5" font-size="17" font-weight="600">Enforcer</text>
  <text x="338" y="296" fill="#8A9AAE" font-size="13">Pure code, no model call. Verify, match, narrow or deny.</text>

  <rect x="320" y="360" width="180" height="90" rx="12" fill="#141C27" stroke="#26323F"/>
  <text x="338" y="390" fill="#A78BFA" font-size="16" font-weight="600">Approval gate</text>
  <text x="338" y="414" fill="#8A9AAE" font-size="13">A person decides.</text>

  <rect x="520" y="360" width="180" height="90" rx="12" fill="#141C27" stroke="#26323F"/>
  <text x="538" y="390" fill="#E6EDF5" font-size="16" font-weight="600">Audit ledger</text>
  <text x="538" y="414" fill="#8A9AAE" font-size="13">Every decision,</text>
  <text x="538" y="432" fill="#8A9AAE" font-size="13">hash-chained.</text>

  <line x1="130" y1="404" x2="130" y2="250" stroke="#8A9AAE" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="138" y="330" fill="#8A9AAE" font-size="13">task</text>
  <line x1="230" y1="172" x2="318" y2="160" stroke="#5AD1DB" stroke-width="1.4" marker-end="url(#arwc)"/>
  <text x="244" y="150" fill="#8A9AAE" font-size="13">plan</text>
  <line x1="318" y1="192" x2="230" y2="204" stroke="#5AD1DB" stroke-width="1.4" marker-end="url(#arwc)"/>
  <text x="236" y="228" fill="#8A9AAE" font-size="12">lease, signed + TTL</text>
  <polyline points="130,246 130,282 318,282" fill="none" stroke="#5AD1DB" stroke-width="1.4" marker-end="url(#arwc)"/>
  <text x="146" y="274" fill="#8A9AAE" font-size="13">tool call + lease</text>
  <line x1="700" y1="282" x2="808" y2="270" stroke="#3ED2A6" stroke-width="1.4" marker-end="url(#arwg)"/>
  <text x="716" y="260" fill="#3ED2A6" font-size="13">allowed</text>
  <line x1="410" y1="320" x2="410" y2="358" stroke="#A78BFA" stroke-width="1.4" marker-end="url(#arwv)"/>
  <text x="418" y="344" fill="#A78BFA" font-size="12">HUMAN_APPROVAL</text>
  <line x1="610" y1="320" x2="610" y2="358" stroke="#8A9AAE" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="524" y="344" fill="#8A9AAE" font-size="12">every decision</text>
  <polyline points="320,428 260,428 260,452 232,452" fill="none" stroke="#8A9AAE" stroke-width="1.4" marker-end="url(#arw)"/>
  <text x="250" y="474" fill="#8A9AAE" font-size="12">approve / deny</text>

  <polyline points="885,450 885,520 60,520 60,198 28,198" fill="none" stroke="#FF6B6B" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arwr)"/>
  <text x="120" y="544" fill="#FF6B6B" font-size="13">Tool results return to the agent. Untrusted content, may carry a prompt injection.</text>
</svg>
